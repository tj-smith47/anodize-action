version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:
    desc: "Pre-commit gate: shellcheck, output-discipline audit, then the bats suite."
    cmds:
      # --severity=warning matches CI: it drops SC1091 info noise from the
      # dynamic `source "$SCRIPT_DIR/lib/…"` indirection shellcheck can't follow.
      - find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning -x
      # Fail if any chatty subprocess is invoked bare — regression guard for the
      # `info: component rust-std is up to date`-class leak.
      - bash scripts/validate/output-discipline.sh scripts
      # Not bare `bats`: a skip exits 0, so a test that stops running reads
      # green. bats-suite.sh gates on the TAP summary (0 failures, 0 skips,
      # planned == reported) exactly as the CI legs do.
      - bash scripts/validate/bats-suite.sh tests

  test:
    desc: Run the bats test suite
    cmds:
      - bash scripts/validate/bats-suite.sh tests

  commit:
    desc: "Lint, then commit. Usage: task commit -- -m 'message'"
    preconditions:
      - sh: test -n "$(git diff --cached --name-only)"
        msg: "Nothing staged. Run git add <files> before task commit."
    cmds:
      - task: lint
      - git commit {{.CLI_ARGS}}
