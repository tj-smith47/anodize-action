name: Update Major Tag (manual recovery)

# The primary major-tag update path is the inline step in release.yml,
# because releases created by the default GITHUB_TOKEN do not fire the
# release:published event (GitHub's recursive-trigger guard).
#
# This workflow exists for manual recovery: if a major tag (e.g. v1)
# ever points at the wrong commit, trigger this from the Actions UI
# with the target release tag and it will re-point.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to retarget the major tag to (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Force-update vN to release commit
    runs-on: ubuntu-latest
    steps:
      - name: Compute major tag
        id: major
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Tag '$TAG_NAME' is not a vMAJOR.MINOR.PATCH semver — aborting." >&2
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          echo "Major tag: $major (from $TAG_NAME)"
          echo "tag=$major" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag to commit SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # The GitHub API may return a tag-object or commit SHA depending on
          # how the tag was created; peel until we reach a commit.
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" --jq '.object.sha')
          type=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" --jq '.object.type')
          if [[ "$type" == "tag" ]]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')
          fi
          echo "Release $TAG_NAME -> commit $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Force-update major tag
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ steps.major.outputs.tag }}
        env:
          # Override GITHUB_SHA so update-tag points the moving major tag at
          # the resolved release commit instead of the workflow_dispatch
          # branch HEAD (which may have advanced past the release).
          GITHUB_SHA: ${{ steps.resolve.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
