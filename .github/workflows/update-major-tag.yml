name: Update Major Tag (manual recovery)

# The primary major-tag update path is the inline step in release.yml,
# because releases created by the default GITHUB_TOKEN do not fire the
# release:published event (GitHub's recursive-trigger guard).
#
# This workflow exists for manual recovery: if a major tag (e.g. v1)
# ever points at the wrong commit, trigger this from the Actions UI
# with the target release tag and it will re-point.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to retarget the major tag to (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Force-update vN to release commit
    runs-on: ubuntu-latest
    steps:
      - name: Compute major tag
        id: major
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Tag '$TAG_NAME' is not a vMAJOR.MINOR.PATCH semver — aborting." >&2
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          echo "Major tag: $major (from $TAG_NAME)"
          echo "tag=$major" >> "$GITHUB_OUTPUT"

      - name: Force-update major tag via octokit
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ inputs.release_tag }}';
            const majorTag = '${{ steps.major.outputs.tag }}';
            const { owner, repo } = context.repo;

            // 1. Resolve release_tag to a commit SHA, peeling annotated tags.
            const tagRef = await github.rest.git.getRef({
              owner, repo, ref: `tags/${tagName}`,
            });
            let sha = tagRef.data.object.sha;
            if (tagRef.data.object.type === 'tag') {
              const tagObj = await github.rest.git.getTag({
                owner, repo, tag_sha: sha,
              });
              sha = tagObj.data.object.sha;
            }
            core.info(`Release ${tagName} -> commit ${sha}`);

            // 2. Delete-then-recreate the major tag.
            //    updateRef returns 403 "Resource not accessible by
            //    integration" under GITHUB_TOKEN when moving v1 to an
            //    arbitrary commit (the API appears to gate non-fast-forward
            //    ref moves more strictly than creates/deletes). Splitting
            //    the operation into deleteRef + createRef sidesteps that.
            try {
              await github.rest.git.deleteRef({
                owner, repo,
                ref: `tags/${majorTag}`,
              });
              core.info(`Deleted existing ${majorTag}`);
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) throw e;
            }
            await github.rest.git.createRef({
              owner, repo,
              ref: `refs/tags/${majorTag}`,
              sha,
            });
            core.info(`Created ${majorTag} -> ${sha}`);
