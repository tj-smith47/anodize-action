name: Update Major Tag (manual recovery)

# The primary major-tag update path is the inline step in release.yml,
# because releases created by the default GITHUB_TOKEN do not fire the
# release:published event (GitHub's recursive-trigger guard).
#
# This workflow exists for manual recovery: if a major tag (e.g. v1)
# ever points at the wrong commit, trigger this from the Actions UI
# with the target release tag and it will re-point.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to retarget the major tag to (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Force-update vN to release commit
    runs-on: ubuntu-latest
    steps:
      - name: Compute major tag
        id: major
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Tag '$TAG_NAME' is not a vMAJOR.MINOR.PATCH semver — aborting." >&2
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          echo "Major tag: $major (from $TAG_NAME)"
          echo "tag=$major" >> "$GITHUB_OUTPUT"

      - name: Force-update major tag via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.release_tag }}
          MAJOR_TAG: ${{ steps.major.outputs.tag }}
        run: |
          set -euo pipefail

          # 1. Resolve inputs.release_tag (e.g. v1.0.0) to a commit SHA. Peel
          #    annotated tag objects to reach the underlying commit.
          obj_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" --jq '.object.sha')
          obj_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" --jq '.object.type')
          if [[ "$obj_type" == "tag" ]]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" --jq '.object.sha')
          else
            sha="$obj_sha"
          fi
          echo "Release $TAG_NAME -> commit $sha"

          # 2. Update (or create) refs/tags/${MAJOR_TAG} to point at sha.
          # PATCH refs/tags/X with sha only (no force flag) — this is the
          # call shape octokit's git.updateRef uses internally, and
          # GITHUB_TOKEN is allowed to perform it. Passing force=true via
          # the REST API triggers 403 from GITHUB_TOKEN integrations.
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" \
              -f sha="$sha"
            echo "Updated $MAJOR_TAG -> $sha"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR_TAG}" -f sha="$sha"
            echo "Created $MAJOR_TAG -> $sha"
          fi
