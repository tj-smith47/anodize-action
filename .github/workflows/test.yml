name: Test

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck on scripts/
        run: |
          shopt -s nullglob globstar
          # --severity=warning skips SC1091 info noise (shellcheck cannot
          # resolve ${GITHUB_ACTION_PATH}/... sources outside the action
          # runtime). Real bugs surface as warning or error.
          shellcheck --severity=warning -x scripts/**/*.sh

  output-discipline:
    name: Output discipline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail if a chatty-on-success subprocess is invoked bare (not via
      # anodizer::run_quiet, a gha_section group, output redirect/capture, or a
      # `# bare-ok:` marker). Regression guard for the leak class where rustup /
      # apt-get / cargo chatter bleeds into the log at default verbosity.
      - name: Audit output discipline
        run: bash scripts/validate/output-discipline.sh scripts

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  validate-action-yml:
    name: Validate action.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Asserts the top-level keys AND that every composite step has
      # run-or-uses (+ shell where run) — the step-level check actionlint
      # skips for composite actions and a YAML syntax check cannot catch.
      - name: Validate action.yml manifest
        run: bash scripts/validate/action-manifest.sh action.yml

  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and Linux fail for different reasons; surfacing only the first
      # would hide the other for a whole round trip.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git-Bash on the Windows leg — the suite is bash, and MSYS is the
        # environment every Windows consumer of this action's scripts runs in.
        shell: bash
    env:
      # Every capability the suite needs is provisioned below on BOTH legs, so
      # any skip is a test that stopped running, not a host gap. bats-suite.sh
      # fails when the real count moves off this in either direction.
      ANODIZER_EXPECTED_SKIPS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # action-manifest.sh is a python3 + PyYAML program, and the snapcraft
      # pip-fallback arms drive an interpreter. Windows CPython ships no
      # python3.exe; tests/test_helper.bash publishes `python` under that name,
      # so pinning one interpreter here is enough for both legs.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          # Assert from bash, not just from the setup action: if the
          # interpreter is unreachable here the suite degrades to 13 skips,
          # and the skip budget would report the symptom rather than this
          # cause. tomllib (3.11+) is what the snapcraft constraints
          # generator needs.
          python -c 'import yaml, tomllib'

      # The tests/*.bats suite exercises the real install/run/validate scripts
      # in isolated throwaway dirs; it had no CI job, so regressions in the
      # scripts shipped uncaught. Pin bats-core by tag so the runner matches
      # local dev. The clone is put on PATH in-place rather than installed to a
      # prefix: install.sh needs sudo, which Git-Bash has no equivalent for.
      - name: Run bats suite
        run: |
          git clone --depth 1 --branch v1.11.1 \
            https://github.com/bats-core/bats-core.git .bats-core
          export PATH="${PWD}/.bats-core/bin:${PATH}"
          bash scripts/validate/bats-suite.sh tests

  zig-cross-smoke:
    name: Zig cross-compile smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install the DEFAULT-pinned zig + the unpinned (latest) cargo-zigbuild
      # through the action's own install path — the same bytes a consumer's
      # determinism shard gets.
      - name: Install zig + cargo-zigbuild via the action
        uses: ./
        with:
          install-only: 'true'
          install: zig,cargo-zigbuild
          install-rust: 'true'

      # Cross-compile a crate with a C-crypto dependency (ring) to every
      # Linux-shard cross target the harness supports. ring's build script
      # compiles C against zig's bundled per-target libc headers, so this
      # fails loudly if the pinned zig's libc tree is incomplete for ANY
      # supported target — the class that shipped when zig 0.13.0 (missing
      # generic-freebsd/assert.h) broke x86_64-unknown-freebsd only at a
      # consumer's release run. ring is intentionally unpinned: the smoke
      # tracks the current ecosystem, and a new-ring breakage is exactly the
      # signal this job exists to surface before a consumer hits it.
      - name: Cross-build ring to every supported cross target
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl x86_64-unknown-freebsd
          cargo new "${RUNNER_TEMP}/zig-smoke" --bin
          cd "${RUNNER_TEMP}/zig-smoke"
          cargo add ring
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-unknown-linux-musl x86_64-unknown-freebsd; do
            echo "::group::cargo zigbuild --target $t"
            cargo zigbuild --release --target "$t"
            echo "::endgroup::"
          done
