name: 'Anodizer Action'
description: 'GitHub Action for Anodizer — a Rust-native release automation tool'
author: 'tj-smith47'
branding:
  color: 'orange'
  icon: 'package'

inputs:
  # ---------------------------------------------------------------------------
  # Installation source (pick one path)
  # ---------------------------------------------------------------------------
  version:
    description: >
      Anodizer version to install from GitHub releases. Accepts an exact tag
      (e.g. "v0.1.1"), the literal "latest" (newest stable release), or the
      literal "nightly" (newest release whose tag matches `*-nightly`,
      i.e. `vX.Y.Z-<sha>-nightly`). Semver ranges such as "~> v2" are NOT
      supported — pass an explicit tag, "latest", "nightly", or use
      `from-artifact` / `from-source`. Ignored when `from-artifact` or
      `from-source` is set.
    default: 'latest'
    required: false
  from-artifact:
    description: >
      Download a pre-built anodizer binary from a workflow artifact instead of
      GitHub releases. Set to the artifact name (e.g. "anodizer-linux"). For
      cross-workflow downloads, also set `artifact-run-id`.
    required: false
  artifact-run-id:
    description: >
      Workflow run ID to download the artifact from. Use "auto" to automatically
      resolve the latest successful run of `artifact-workflow` for the current
      commit. Use a numeric ID for explicit control. Omit to download from
      the current workflow run.
    required: false
  artifact-workflow:
    description: >
      Workflow filename to search when `artifact-run-id` is "auto"
      (e.g. "ci.yml"). Ignored otherwise.
    default: 'ci.yml'
    required: false
  from-source:
    description: >
      Build anodizer from source in the current workdir (bootstrap mode).
      Requires a Rust toolchain — combine with `install-rust: true` if needed.
      Useful when `from-artifact` is only available for one platform and the
      current runner needs a platform-native binary.
    default: 'false'
    required: false

  # ---------------------------------------------------------------------------
  # Dependency setup
  # ---------------------------------------------------------------------------
  install:
    description: >
      Comma-separated list of build/pipeline dependencies to install.
      Supported: nfpm, makeself, snapcraft, rpmbuild, cosign, syft, zig,
      cargo-zigbuild, upx, nsis, create-dmg, flatpak, alejandra. Uses the
      platform's native package manager (apt on Linux, brew on macOS,
      choco on Windows); some deps fall back to direct downloads when no
      packaged version exists.
    required: false
  auto-install:
    description: >
      Parse `.anodizer.yaml` in the workdir and automatically install the
      dependencies needed by the configured stages (nfpm, makeself, snapcraft,
      rpmbuild for srpm, cosign for binary_signs/docker_signs, syft for sboms,
      nsis, create-dmg, flatpak-builder, upx, zig+cargo-zigbuild for
      cross-compilation, alejandra when the nix publisher requests it as the
      formatter).
    default: 'false'
    required: false
  install-rust:
    description: 'Install the stable Rust toolchain (dtolnay/rust-toolchain).'
    default: 'false'
    required: false

  # ---------------------------------------------------------------------------
  # Workspace resolution (monorepo tag → crate mapping)
  # ---------------------------------------------------------------------------
  resolve-workspace:
    description: >
      Resolve the triggering tag to a crate name using `anodizer resolve-tag`.
      Set to "true" on tag-triggered release workflows. Populates the
      `workspace`, `crate-path`, and `has-builds` outputs.
    default: 'false'
    required: false

  # ---------------------------------------------------------------------------
  # Docker setup (for projects using docker_v2 in .anodizer.yaml)
  # ---------------------------------------------------------------------------
  docker-registry:
    description: >
      Container registry to log in to (e.g. "ghcr.io"). When set, the action
      logs in, and sets up QEMU + buildx for multi-platform builds.
    required: false
  docker-username:
    description: 'Registry username (defaults to github.actor via GITHUB_ACTOR env).'
    required: false
  docker-password:
    description: 'Registry password or token (e.g. secrets.GITHUB_TOKEN).'
    required: false

  # ---------------------------------------------------------------------------
  # Split artifact management
  # ---------------------------------------------------------------------------
  upload-dist:
    description: >
      Upload dist/ as a workflow artifact after running anodizer. Set to "true"
      in split build jobs. The artifact name defaults to "dist-$RUNNER_OS".
    default: 'false'
    required: false
  download-dist:
    description: >
      Download and merge dist-* artifacts before running anodizer. Set to "true"
      in merge jobs. Merges all artifacts matching "dist-*" into dist/.
    default: 'false'
    required: false

  # ---------------------------------------------------------------------------
  # Key material
  # ---------------------------------------------------------------------------
  gpg-private-key:
    description: >
      GPG private key contents to import for signing. The key is piped into
      `gpg --batch --import`.
    required: false
  apk-private-key:
    description: >-
      PEM-format RSA private key for signing apk packages produced by
      nfpm. Required if your `.anodizer.yaml` configures
      `nfpm[].apk.signature` (apk-tools uses its own RSA-PSS scheme,
      not OpenPGP, so the GPG key consumed by `gpg-private-key` does
      not work here). The private key is written to a temp file with
      mode 0600 and the path is exported as `APK_PRIVATE_KEY_PATH` for
      subsequent steps and the anodizer config to consume. The matching
      public key is derived via `openssl rsa -pubout`, exported as
      `APK_PUBLIC_KEY_PATH`, and copied into `./dist/` as
      `<repo>-apk-signing-key.rsa.pub` so consumers can attach it as
      a release asset via `release.extra_files`; apk verifiers install
      that file under `/etc/apk/keys/` before `apk add`-ing a signed
      package.
    required: false
    default: ""
  cosign-key:
    description: >
      Cosign private key contents. Written to `cosign.key` in the workdir
      with mode 0600. Pair with `COSIGN_PASSWORD` in the env.
    required: false

  # ---------------------------------------------------------------------------
  # Execution
  # ---------------------------------------------------------------------------
  args:
    description: >
      Arguments to pass to anodizer (e.g. "release --snapshot"). Do NOT embed
      secrets or tokens here — this value appears in workflow logs. Pass
      secrets via the `env:` block (e.g. `GITHUB_TOKEN`, `COSIGN_PASSWORD`).
    required: false
  workdir:
    description: 'Working directory (below repository root).'
    default: '.'
    required: false
  install-only:
    description: 'Only install anodizer without running it.'
    default: 'false'
    required: false

  # ---------------------------------------------------------------------------
  # Determinism harness
  # ---------------------------------------------------------------------------
  determinism:
    description: >
      Run the determinism harness (`anodizer check determinism`) on this shard.
      When true, the action: installs Rust (if not already), builds anodizer
      from source, installs cross-build deps (zig, cargo-zigbuild, upx) on
      Linux, derives the configured-target CSV for the current RUNNER_OS via
      `anodizer targets --json`, `rustup target add`s those triples, and
      invokes the harness. Intended to be the entire body of a per-OS
      harness shard on a 3-OS matrix [ubuntu-latest, macos-latest,
      windows-latest]. Mutually exclusive with `args`.
    default: 'false'
    required: false
  determinism-runs:
    description: 'N for `anodizer check determinism --runs=N`.'
    default: '2'
    required: false
  determinism-stages:
    description: >
      Stages to validate (comma-separated). When unset, defaults to the
      stages configured-and-installable on the current RUNNER_OS:
      Linux gets `build,source,upx,archive,nfpm,makeself,snapcraft,sbom,sign,checksum`;
      macOS and Windows get `build,source,upx,archive,sbom,sign,checksum`
      (no nfpm/makeself/snapcraft — apt is Linux-only and apk/deb/rpm
      signing isn't provisioned on the non-Linux shards). Explicit
      values override.
    default: ''
    required: false
  determinism-targets:
    description: >
      Explicit target CSV override. When unset, the action filters
      `anodizer targets --json` to entries matching the current RUNNER_OS.
      Set when your shard runs on a non-standard runner label.
    required: false
  preserve-dist:
    description: >
      Have the determinism harness preserve its hermetic dist tree to
      `./preserved-dist/` so a downstream `release: --publish-only` job
      can publish directly from the byte-stable artifacts. Manifests
      get a `-<shard-label>` suffix (`context-<label>.json`, etc.) so
      sharded matrix uploads don't collide under `merge-multiple: true`.
      Requires `determinism: 'true'` and `shard-label`.
    default: 'false'
    required: false
  shard-label:
    description: >
      Per-shard suffix appended to preserved-dist manifests. The caller
      names each shard explicitly; the action does not derive labels.
      Required when `preserve-dist: 'true'`.
    required: false
    default: ''

outputs:
  artifacts:
    description: 'Build result artifacts JSON (contents of dist/artifacts.json).'
    value: ${{ steps.outputs.outputs.artifacts }}
  metadata:
    description: 'Build result metadata JSON (contents of dist/metadata.json).'
    value: ${{ steps.outputs.outputs.metadata }}
  release-url:
    description: 'URL of the created GitHub release (extracted from metadata.json).'
    value: ${{ steps.outputs.outputs.release-url }}
  workspace:
    description: 'Crate name resolved from the triggering tag (requires resolve-workspace: true).'
    value: ${{ steps.resolve-workspace.outputs.crate }}
  crate-path:
    description: 'Path to the resolved crate directory (requires resolve-workspace: true).'
    value: ${{ steps.resolve-workspace.outputs.path }}
  has-builds:
    description: 'Whether the resolved crate has binary builds configured (requires resolve-workspace: true).'
    value: ${{ steps.resolve-workspace.outputs.has-builds }}
  split-matrix:
    description: >
      JSON matrix for `strategy.matrix` covering all configured build targets.
      Produced from `.anodizer.yaml` when `install-only: true`. Each entry has
      `os`, `target`, and `artifact` fields.
    value: ${{ steps.split-matrix.outputs.matrix }}

runs:
  using: 'composite'
  steps:
    # -------------------------------------------------------------------------
    # Platform detection
    # -------------------------------------------------------------------------
    - name: Determine platform
      id: platform
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *)       echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *)     echo "::error::Unsupported arch: $RUNNER_ARCH"; exit 1 ;;
        esac
        echo "os=$os" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
        if [ "$os" = "windows" ]; then
          echo "bin=anodizer.exe" >> "$GITHUB_OUTPUT"
          echo "ext=zip" >> "$GITHUB_OUTPUT"
        else
          echo "bin=anodizer" >> "$GITHUB_OUTPUT"
          echo "ext=tar.gz" >> "$GITHUB_OUTPUT"
        fi

    # -------------------------------------------------------------------------
    # Determinism-mode mutual-exclusion check — `args` is forbidden in
    # determinism mode because the action drives the harness invocation
    # itself (the harness already wraps `anodizer release ...` via
    # `anodizer check determinism`).
    # -------------------------------------------------------------------------
    - name: Validate determinism inputs
      if: inputs.determinism == 'true' && inputs.args != ''
      shell: bash
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        echo "::error::determinism: true is mutually exclusive with args:; the action invokes \`anodizer check determinism\` directly"
        anodizer::err "determinism: true is mutually exclusive with args:"
        exit 1

    - name: Validate preserve-dist inputs
      if: inputs.preserve-dist == 'true'
      shell: bash
      env:
        DETERMINISM: ${{ inputs.determinism }}
        SHARD_LABEL: ${{ inputs.shard-label }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        if [ "$DETERMINISM" != "true" ]; then
          echo "::error::preserve-dist: 'true' requires determinism: 'true'"
          anodizer::err "preserve-dist requires determinism mode"
          exit 1
        fi
        if [ -z "$SHARD_LABEL" ]; then
          echo "::error::preserve-dist: 'true' requires shard-label to be set"
          anodizer::err "preserve-dist requires shard-label input"
          exit 1
        fi

    # -------------------------------------------------------------------------
    # Rust toolchain (optional; prereq for from-source and cargo-zigbuild).
    # Determinism mode auto-enables this — the harness builds anodizer from
    # source so it tests the actual code under review, not a stale release.
    # -------------------------------------------------------------------------
    - name: Install Rust toolchain
      if: inputs.install-rust == 'true' || inputs.determinism == 'true'
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    # -------------------------------------------------------------------------
    # Cargo target-dir cache (from-source / determinism paths only).
    # Without this, every determinism shard cold-builds anodizer from scratch,
    # which dominates shard wall-time on cache-cold runners. The cache key is
    # disambiguated per mode so a from-source consumer doesn't collide with a
    # determinism shard (different feature sets / build profiles otherwise).
    # -------------------------------------------------------------------------
    - name: Cache cargo target dir
      if: inputs.determinism == 'true' || inputs.from-source == 'true'
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: anodizer-action-${{ inputs.determinism == 'true' && 'determinism' || 'from-source' }}
        workspaces: ${{ inputs.workdir }}

    # -------------------------------------------------------------------------
    # Dependency installation
    # -------------------------------------------------------------------------
    - name: Auto-detect dependencies from .anodizer.yaml
      if: inputs.auto-install == 'true'
      id: auto-detect
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        set -euo pipefail
        deps=()
        cfg=""
        for candidate in .anodizer.yaml .anodizer.yml anodizer.yaml anodizer.yml; do
          if [ -f "$candidate" ]; then
            cfg="$candidate"
            break
          fi
        done
        if [ -z "$cfg" ]; then
          echo "::warning::auto-install: no anodizer config found, skipping"
          echo "deps=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Match top-level keys that signal dependency needs
        grep -qE '^nfpm:|^  - name: anodizer-stage-nfpm' "$cfg" && deps+=("nfpm") || true
        grep -qE '^makeselfs:' "$cfg" && deps+=("makeself") || true
        grep -qE '^snapcrafts:' "$cfg" && deps+=("snapcraft") || true
        grep -qE '^srpm:' "$cfg" && deps+=("rpmbuild") || true
        grep -qE '^binary_signs:|^docker_signs:' "$cfg" && deps+=("cosign") || true
        grep -qE '^sboms:' "$cfg" && deps+=("syft") || true
        grep -qE '^upx:' "$cfg" && deps+=("upx") || true
        grep -qE '^nsis:' "$cfg" && deps+=("nsis") || true
        grep -qE '^dmgs:' "$cfg" && deps+=("create-dmg") || true
        grep -qE '^flatpaks:' "$cfg" && deps+=("flatpak") || true
        # alejandra is only needed when the nix publisher opts into it as
        # the formatter (the alternative is `nixfmt`, which we don't ship
        # an auto-installer for yet).
        grep -qE '^[[:space:]]+formatter:[[:space:]]*alejandra[[:space:]]*$' "$cfg" && deps+=("alejandra") || true
        # pkgs/msis can't be cross-built: warn when config asks for them on the wrong runner.
        if grep -qE '^pkgs:' "$cfg" && [ "${RUNNER_OS:-}" != "macOS" ]; then
          echo "::warning::auto-install: pkgs: requires macOS runner (got ${RUNNER_OS:-unset}); skipping"
        fi
        if grep -qE '^msis:' "$cfg" && [ "${RUNNER_OS:-}" != "Windows" ]; then
          echo "::warning::auto-install: msis: requires Windows runner (got ${RUNNER_OS:-unset}); skipping"
        fi
        # Cross-compilation needs zig + cargo-zigbuild
        grep -qE '^[[:space:]]*cross:[[:space:]]*(auto|zigbuild)[[:space:]]*$' "$cfg" && deps+=("zig" "cargo-zigbuild") || true
        joined=$(IFS=','; echo "${deps[*]}")
        echo "::notice::auto-install detected: ${joined:-none}"
        echo "deps=$joined" >> "$GITHUB_OUTPUT"

    - name: Emit determinism dependency set
      if: inputs.determinism == 'true'
      id: det-deps
      shell: bash
      run: |
        set -euo pipefail
        # Tools needed by the harness's per-shard `determinism-stages`
        # default. Linux adds nfpm because the Linux default stage list
        # includes nfpm; the other runners' default list does not, so
        # they skip the install. zig + cargo-zigbuild are Linux-only
        # because cross-compile from non-Linux runners isn't supported
        # by the matrix. cosign / syft are pre-installed even when
        # sign / sbom would skip — both are cheap and the determinism
        # default exercises both.
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "deps=zig,cargo-zigbuild,upx,nfpm,makeself,snapcraft,syft,cosign" >> "$GITHUB_OUTPUT"
        else
          echo "deps=upx,syft,cosign" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      if: inputs.install != '' || steps.auto-detect.outputs.deps != '' || steps.det-deps.outputs.deps != ''
      shell: bash
      env:
        EXPLICIT_INSTALL: ${{ inputs.install }}
        AUTO_INSTALL: ${{ steps.auto-detect.outputs.deps }}
        DETERMINISM_INSTALL: ${{ steps.det-deps.outputs.deps }}
      run: "${GITHUB_ACTION_PATH}/scripts/install-deps.sh"

    # -------------------------------------------------------------------------
    # Key material
    # -------------------------------------------------------------------------
    - name: Import GPG private key
      if: inputs.gpg-private-key != ''
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        # Defence-in-depth: mask each line of the key in case auto-masking was
        # lost crossing a reusable-workflow boundary.
        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done <<< "$GPG_PRIVATE_KEY"
        # Import into the keyring (consumed by archive/checksum `signs:` blocks
        # via `--local-user $GPG_FINGERPRINT`).
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        # Also write the key to a file for nfpm package signing. rpmsign /
        # dpkg-sig / abuild-sign read the secret key directly off disk rather
        # than going through gpg-agent, so anodizer's `nfpm.signature.key_file`
        # needs a path. Same key material as the keyring import above.
        gpg_key_file="${RUNNER_TEMP}/anodizer-signing.asc"
        printf '%s' "$GPG_PRIVATE_KEY" > "$gpg_key_file"
        chmod 600 "$gpg_key_file"
        echo "GPG_KEY_PATH=${gpg_key_file}" >> "$GITHUB_ENV"
        # Allow non-interactive passphrase (rpmsign / gpg need this in CI).
        mkdir -p "${HOME}/.gnupg"
        chmod 700 "${HOME}/.gnupg"
        grep -qxF 'allow-loopback-pinentry' "${HOME}/.gnupg/gpg-agent.conf" 2>/dev/null \
          || echo 'allow-loopback-pinentry' >> "${HOME}/.gnupg/gpg-agent.conf"
        grep -qxF 'pinentry-mode loopback' "${HOME}/.gnupg/gpg.conf" 2>/dev/null \
          || echo 'pinentry-mode loopback' >> "${HOME}/.gnupg/gpg.conf"
        gpgconf --kill gpg-agent || true
        echo "::notice::GPG private key imported"
        anodizer::ok "GPG private key imported (keyring + GPG_KEY_PATH for nfpm)"

    - name: Provision apk signing keys
      if: inputs.apk-private-key != ''
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        APK_PRIVATE_KEY_INPUT: ${{ inputs.apk-private-key }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        # Defence-in-depth: mask each line in case auto-masking was lost
        # crossing a reusable-workflow boundary.
        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done <<< "$APK_PRIVATE_KEY_INPUT"
        # apk-tools uses RSA-PSS, not OpenPGP, so nfpm's apk packager needs
        # a raw PEM RSA private key (not the GPG-armored block deb/rpm
        # consume). Write to $RUNNER_TEMP so the file is cleaned at job end.
        privfile="${RUNNER_TEMP}/anodizer-apk.rsa"
        pubfile="${RUNNER_TEMP}/anodizer-apk.rsa.pub"
        install -m 0600 /dev/null "$privfile"
        printf '%s\n' "$APK_PRIVATE_KEY_INPUT" > "$privfile"
        # Derive the matching public key so the release pipeline can attach
        # it as an asset. apk verifiers install the pub key to
        # /etc/apk/keys/ before `apk add`-ing a signed package.
        openssl rsa -in "$privfile" -pubout -out "$pubfile" 2>/dev/null
        chmod 0644 "$pubfile"
        # Drop the pub key into dist/ so anodizer's release.extra_files glob
        # can pick it up alongside the signed apk(s). dist/ may not exist yet
        # in single-shot release jobs; create it. In --merge jobs dist/ has
        # already been populated by actions/download-artifact.
        mkdir -p ./dist
        cp "$pubfile" "./dist/${GITHUB_REPOSITORY##*/}-apk-signing-key.rsa.pub"
        echo "APK_PRIVATE_KEY_PATH=${privfile}" >> "$GITHUB_ENV"
        echo "APK_PUBLIC_KEY_PATH=${pubfile}" >> "$GITHUB_ENV"
        echo "::notice::apk signing keys written"
        anodizer::ok "apk signing keys written (APK_PRIVATE_KEY_PATH for nfpm; pub key staged in dist/)"

    - name: Write cosign key
      if: inputs.cosign-key != ''
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        COSIGN_KEY_CONTENTS: ${{ inputs.cosign-key }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        # Defence-in-depth: mask each line of the key in case auto-masking was
        # lost crossing a reusable-workflow boundary.
        while IFS= read -r line; do
          [ -n "$line" ] && echo "::add-mask::$line"
        done <<< "$COSIGN_KEY_CONTENTS"
        printf '%s' "$COSIGN_KEY_CONTENTS" > cosign.key
        chmod 600 cosign.key
        echo "::notice::Cosign key written to cosign.key"
        anodizer::ok "cosign key written to cosign.key"

    # -------------------------------------------------------------------------
    # Installation — Path A: from workflow artifact
    # -------------------------------------------------------------------------
    - name: Resolve artifact run ID
      if: inputs.from-artifact != '' && inputs.artifact-run-id != ''
      id: resolve-run
      shell: bash
      env:
        ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        ARTIFACT_WORKFLOW: ${{ inputs.artifact-workflow }}
        FROM_ARTIFACT: ${{ inputs.from-artifact }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "$ARTIFACT_RUN_ID" = "auto" ]; then
          "${GITHUB_ACTION_PATH}/scripts/resolve-artifact-run.sh"
        else
          echo "run_id=$ARTIFACT_RUN_ID" >> "$GITHUB_OUTPUT"
        fi

    - name: Download artifact
      if: inputs.from-artifact != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.from-artifact }}
        path: ${{ runner.tool_cache }}/anodizer/artifact
        github-token: ${{ inputs.artifact-run-id != '' && github.token || '' }}
        run-id: ${{ steps.resolve-run.outputs.run_id || '' }}

    - name: Install from artifact
      if: inputs.from-artifact != ''
      shell: bash
      env:
        BIN: ${{ steps.platform.outputs.bin }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        install_dir="${RUNNER_TOOL_CACHE}/anodizer/artifact"
        chmod +x "${install_dir}/${BIN}" 2>/dev/null || true
        echo "${install_dir}" >> "$GITHUB_PATH"
        echo "::notice::anodizer installed from artifact to ${install_dir}"
        anodizer::verb Installed "anodizer from artifact"
        anodizer::detail "${install_dir}/${BIN}"

    # -------------------------------------------------------------------------
    # Installation — Path B: from GitHub release
    # -------------------------------------------------------------------------
    - name: Resolve version
      if: inputs.from-artifact == '' && inputs.from-source != 'true' && inputs.determinism != 'true'
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        if [ "$INPUT_VERSION" = "latest" ]; then
          tag=$(gh api repos/tj-smith47/anodizer/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve latest anodizer release"
            anodizer::err "could not resolve latest anodizer release"
            exit 1
          fi
        elif [ "$INPUT_VERSION" = "nightly" ]; then
          # Mirrors goreleaser-action ≥ v7.2.0 immutable-nightly resolution:
          # list releases (newest first), pick the first non-draft tag whose
          # name matches `*-nightly`. Anodizer's nightly tag format is
          # `vX.Y.Z-<sha>-nightly`, so this jq pattern is exact.
          tag=$(gh api 'repos/tj-smith47/anodizer/releases?per_page=30' \
            --jq '[.[] | select(.draft == false) | .tag_name | select(test("-nightly$"))] | .[0] // empty' \
            2>/dev/null || echo "")
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve nightly anodizer release (no published tag matches '*-nightly')"
            anodizer::err "could not resolve nightly anodizer release"
            exit 1
          fi
        else
          if [[ "$INPUT_VERSION" =~ ^(~\>|\^|\>=|\<=|\>|\<) ]]; then
            echo "::error::version: '$INPUT_VERSION' is not supported — pass an exact tag (e.g. 'v0.1.1'), 'latest', or 'nightly'"
            anodizer::err "version: '$INPUT_VERSION' is not supported — pass an exact tag (e.g. 'v0.1.1'), 'latest', or 'nightly'"
            exit 1
          fi
          tag="$INPUT_VERSION"
          if [[ ! "$tag" =~ ^v ]]; then
            tag="v$tag"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::version: '$INPUT_VERSION' is not a valid semver tag (expected 'vMAJOR.MINOR.PATCH')"
            anodizer::err "version: '$INPUT_VERSION' is not a valid semver tag (expected 'vMAJOR.MINOR.PATCH')"
            exit 1
          fi
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "::notice::Installing anodizer $tag"
        anodizer::verb Installing "anodizer ${tag}"

    - name: Download release
      if: inputs.from-artifact == '' && inputs.from-source != 'true' && inputs.determinism != 'true'
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
        OS: ${{ steps.platform.outputs.os }}
        ARCH: ${{ steps.platform.outputs.arch }}
        EXT: ${{ steps.platform.outputs.ext }}
        BIN: ${{ steps.platform.outputs.bin }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        version="${TAG#v}"
        archive="anodizer-${version}-${OS}-${ARCH}.${EXT}"
        url="https://github.com/tj-smith47/anodizer/releases/download/${TAG}/${archive}"

        anodizer::verb Downloading "${archive}"
        anodizer::detail "${url}"
        echo "::group::Downloading $url"
        tmpdir=$(mktemp -d)
        downloaded=false
        for attempt in 1 2 3; do
          if curl -fsSL "$url" -o "${tmpdir}/${archive}"; then
            downloaded=true
            break
          fi
          echo "::warning::Download attempt ${attempt}/3 failed, retrying in ${attempt}s..."
          anodizer::warn "download attempt ${attempt}/3 failed, retrying in ${attempt}s..."
          sleep "$attempt"
        done
        if [ "$downloaded" != "true" ]; then
          echo "::error::Failed to download anodizer ${TAG} from ${url} after 3 attempts"
          anodizer::err "failed to download anodizer ${TAG} after 3 attempts"
          exit 1
        fi
        echo "::endgroup::"

        anodizer::verb Extracting "${archive}"
        echo "::group::Extracting"
        install_dir="${RUNNER_TOOL_CACHE}/anodizer/${version}"
        mkdir -p "$install_dir"
        if [ "$EXT" = "zip" ]; then
          unzip -q -o "${tmpdir}/${archive}" -d "$install_dir"
        else
          tar -xzf "${tmpdir}/${archive}" -C "$install_dir"
        fi
        rm -rf "$tmpdir"
        echo "::endgroup::"

        chmod +x "${install_dir}/${BIN}" 2>/dev/null || true
        echo "${install_dir}" >> "$GITHUB_PATH"
        echo "::notice::anodizer ${TAG} installed to ${install_dir}"
        anodizer::ok "anodizer ${TAG} installed"
        anodizer::detail "${install_dir}/${BIN}"

    # -------------------------------------------------------------------------
    # Installation — Path C: from source (bootstrap)
    # -------------------------------------------------------------------------
    - name: Build anodizer from source
      if: inputs.from-source == 'true' || inputs.determinism == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        BIN: ${{ steps.platform.outputs.bin }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        if ! command -v cargo > /dev/null 2>&1; then
          echo "::error::from-source requires Rust; set install-rust: true"
          anodizer::err "from-source requires Rust; set install-rust: true"
          exit 1
        fi
        anodizer::verb Building "anodizer from source"
        echo "::group::Building anodizer from source"
        cargo build --release -p anodizer
        install_dir="${RUNNER_TOOL_CACHE}/anodizer/source"
        mkdir -p "$install_dir"
        cp "target/release/${BIN}" "${install_dir}/${BIN}"
        chmod +x "${install_dir}/${BIN}" 2>/dev/null || true
        echo "${install_dir}" >> "$GITHUB_PATH"
        echo "::notice::anodizer built from source and installed to ${install_dir}"
        echo "::endgroup::"
        anodizer::ok "anodizer built from source"
        anodizer::detail "${install_dir}/${BIN}"

    # -------------------------------------------------------------------------
    # Workspace resolution (monorepo tag → crate)
    # -------------------------------------------------------------------------
    - name: Resolve workspace from tag
      if: inputs.resolve-workspace == 'true' && github.ref_type == 'tag'
      id: resolve-workspace
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        if ! command -v anodizer > /dev/null 2>&1; then
          echo "::error::resolve-workspace requires anodizer to be installed"
          anodizer::err "resolve-workspace requires anodizer to be installed"
          exit 1
        fi
        output=$(anodizer resolve-tag "$TAG")
        crate=$(echo "$output" | grep '^crate=' | cut -d= -f2)
        path=$(echo "$output" | grep '^path=' | cut -d= -f2)
        has_builds=$(echo "$output" | grep '^has-builds=' | cut -d= -f2)
        if [ -z "$crate" ]; then
          echo "::error::No crate matches tag '$TAG'"
          anodizer::err "no crate matches tag '$TAG'"
          exit 1
        fi
        echo "crate=$crate" >> "$GITHUB_OUTPUT"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "has-builds=$has_builds" >> "$GITHUB_OUTPUT"
        echo "::notice::Tag '$TAG' → crate '$crate' (path=$path, has-builds=$has_builds)"
        anodizer::verb Resolved "'$TAG' → $crate"
        anodizer::kv path "$path"
        anodizer::kv has-builds "$has_builds"

    # -------------------------------------------------------------------------
    # Docker setup (login + QEMU + buildx)
    # -------------------------------------------------------------------------
    - name: Log in to container registry
      if: inputs.docker-registry != ''
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.docker-registry }}
        username: ${{ inputs.docker-username || github.actor }}
        password: ${{ inputs.docker-password }}

    - name: Set up QEMU
      if: inputs.docker-registry != ''
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      if: inputs.docker-registry != ''
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    # -------------------------------------------------------------------------
    # Download split artifacts (for merge jobs)
    # -------------------------------------------------------------------------
    - name: Download split artifacts
      if: inputs.download-dist == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: ${{ inputs.workdir }}/dist/
        pattern: dist-*
        merge-multiple: true

    - name: Verify split artifacts
      if: inputs.download-dist == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        count=$(find dist -name context.json -type f 2>/dev/null | wc -l)
        if [ "$count" -eq 0 ]; then
          echo "::error::No split context files found in dist/"
          anodizer::err "no split context files found in dist/"
          exit 1
        fi
        anodizer::ok "found $count split context(s)"

    # -------------------------------------------------------------------------
    # Split matrix output — for users building a fan-out from config
    # -------------------------------------------------------------------------
    - name: Produce split matrix
      if: inputs.install-only == 'true'
      id: split-matrix
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        set -euo pipefail
        # Produce a JSON matrix of { os, target, artifact } derived from
        # anodizer's configured build targets. Only runs when install-only.
        if ! command -v anodizer > /dev/null 2>&1; then
          echo "matrix=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if targets=$(anodizer targets --json 2>/dev/null); then
          echo "matrix=$targets" >> "$GITHUB_OUTPUT"
          echo "::notice::split-matrix output populated from anodizer targets --json"
        else
          echo "matrix=" >> "$GITHUB_OUTPUT"
        fi

    # -------------------------------------------------------------------------
    # Determinism harness — runs after the from-source build (so `anodizer`
    # is on PATH) and after install-deps (so zig / cargo-zigbuild / upx are
    # available for the per-target rebuilds the harness drives).
    # -------------------------------------------------------------------------
    - name: Resolve determinism target CSV
      if: inputs.determinism == 'true'
      id: det-targets
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        RUNNER_OS: ${{ runner.os }}
        OVERRIDE: ${{ inputs.determinism-targets }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism-resolve-targets.sh"

    - name: Install determinism target triples
      if: inputs.determinism == 'true'
      shell: bash
      env:
        TARGETS: ${{ steps.det-targets.outputs.csv }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        # The from-source build only installed the host triple. The harness
        # rebuilds anodizer per configured target inside its hermetic worktree,
        # so each shard needs its per-OS target list rustup-target-added.
        IFS=',' read -ra triples <<< "$TARGETS"
        for t in "${triples[@]}"; do
          t=$(printf '%s' "$t" | xargs)
          [ -z "$t" ] && continue
          anodizer::verb Adding "rust target $t"
          rustup target add "$t"
        done
        anodizer::ok "rust targets installed: ${TARGETS}"

    - name: Run determinism harness
      if: inputs.determinism == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        TARGETS: ${{ steps.det-targets.outputs.csv }}
        STAGES_INPUT: ${{ inputs.determinism-stages }}
        RUNS: ${{ inputs.determinism-runs }}
        PRESERVE_DIST: ${{ inputs.preserve-dist }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        # Per-OS default stage list. Empty `inputs.determinism-stages`
        # → expand to the OS-appropriate default; non-empty → caller
        # override wins.
        if [ -n "$STAGES_INPUT" ]; then
          stages="$STAGES_INPUT"
        elif [ "$RUNNER_OS" = "Linux" ]; then
          # makeself sits between nfpm and sbom in the canonical
          # pipeline order (see
          # crates/cli/src/pipeline.rs::build_release_pipeline). A
          # consumer with makeselfs: configured needs the stage in
          # the harness run, otherwise the preserved-dist tree won't
          # contain the self-extracting archive. Snapcraft packs a
          # pre-assembled prime directory (no build env / lxd) and
          # honors SOURCE_DATE_EPOCH for squashfs mtime determinism;
          # the *.snap allowlist in core/src/determinism.rs covers
          # any residual drift.
          stages="build,source,upx,archive,nfpm,makeself,snapcraft,sbom,sign,checksum"
        else
          stages="build,source,upx,archive,sbom,sign,checksum"
        fi

        # `preserve-dist: true` emits a hermetic dist tree for the
        # downstream `release: --publish-only` job. The harness
        # auto-detects tagged HEAD and toggles snapshot mode itself —
        # no GHA-specific `GITHUB_REF` sniffing needed here.
        extra_args=()
        if [ "$PRESERVE_DIST" = "true" ]; then
          extra_args+=(--preserve-dist=./preserved-dist)
        fi

        anodizer::section "anodizer check determinism"
        anodizer::kv targets "$TARGETS"
        anodizer::kv stages "$stages"
        anodizer::kv runs "$RUNS"
        if [ "$PRESERVE_DIST" = "true" ]; then
          anodizer::kv preserve-dist ./preserved-dist
        fi
        # No retry loop here. The harness gates release-quality drift; a
        # retry would mask a flaky-but-real failure. Fail loudly on the
        # first run.
        anodizer check determinism \
          --stages="$stages" \
          --runs="$RUNS" \
          --targets="$TARGETS" \
          "${extra_args[@]}"

    - name: Rename preserved-dist manifests per shard
      if: inputs.determinism == 'true' && inputs.preserve-dist == 'true' && success()
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        SHARD_LABEL: ${{ inputs.shard-label }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"

        # `actions/upload-artifact@v4` followed by `download-artifact@v4
        # merge-multiple: true` will collide on identically-named files
        # across shards. Discriminate each shard's manifests with the
        # caller-provided `shard-label` suffix.
        if [ -z "$SHARD_LABEL" ]; then
          anodizer::err "preserve-dist requires shard-label input"
          exit 1
        fi

        if [ ! -d preserved-dist ]; then
          anodizer::warn "preserved-dist/ missing — nothing to rename"
          exit 0
        fi

        for f in context artifacts metadata; do
          src="preserved-dist/${f}.json"
          dst="preserved-dist/${f}-${SHARD_LABEL}.json"
          if [ -f "$src" ]; then
            mv "$src" "$dst"
            anodizer::verb renamed "$src -> $dst"
          fi
        done
        anodizer::ok "preserved-dist manifests labelled for shard ${SHARD_LABEL}"

    # -------------------------------------------------------------------------
    # Run anodizer
    # -------------------------------------------------------------------------
    - name: Run anodizer
      if: inputs.install-only != 'true' && inputs.args != '' && inputs.determinism != 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ANODIZER_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/scripts/lib-colors.sh"
        # Don't echo ANODIZER_ARGS — users pass tokens/flags via `inputs.args`
        # and GitHub Actions only auto-masks secrets registered with `::add-mask::`.
        anodizer::section "anodizer"
        # Retry up to 3 times for transient failures (registry rate limits,
        # network timeouts, Docker push auth expiry). Deterministic failures
        # (config errors, compile failures) will fail identically each time
        # but the cost of two extra 10s waits is low vs. a flaky release.
        max_retries=3
        attempt=1
        while [ $attempt -le $max_retries ]; do
          # shellcheck disable=SC2086
          # ANODIZER_ARGS is intentionally unquoted — users pass multiple flags
          # separated by whitespace via `inputs.args`, and we rely on word
          # splitting to forward them as distinct argv entries.
          if anodizer $ANODIZER_ARGS; then
            break
          fi
          if [ $attempt -eq $max_retries ]; then
            anodizer::err "anodizer failed after ${max_retries} attempts"
            exit 1
          fi
          anodizer::warn "attempt ${attempt}/${max_retries} failed; retrying in 10s..."
          # Clean generated artifacts between retries to prevent "already exists"
          # collisions.  Preserve split-build subdirectories entirely — any
          # directory holding a `context.json` is a split input (produced by a
          # build job and consumed by --merge), so its files must survive so
          # merge-mode retries can re-run idempotently.
          if [ -d "./dist" ]; then
            # Skip top-level cleanup when a preserved-dist context
            # manifest is present at the dist root: the publish-only
            # path consumes context.json / context-<shard>.json /
            # artifacts*.json / the preserved archives, and expects
            # them to survive between retries. Wiping them turns any
            # transient anodizer failure into an unrecoverable
            # workflow run.
            if [ -f "./dist/context.json" ] || ls ./dist/context-*.json >/dev/null 2>&1; then
              anodizer::warn "preserved-dist context manifests present at dist root; skipping ALL retry cleanup to keep --publish-only inputs intact"
            else
              # Remove top-level generated files (archives, manifests, etc).
              find ./dist -maxdepth 1 -type f -delete 2>/dev/null || true
              # Remove depth-≥2 files only in subdirs that are NOT split inputs.
              # Hoisted under the same outer preserved-dist guard so a
              # preserved tree's per-arch subdirs (e.g.
              # dist/makeself/default/linux_amd64/anodizer) are not
              # nuked between retry attempts.
              for d in ./dist/*/; do
                [ -d "$d" ] || continue
                if [ ! -f "${d}context.json" ]; then
                  find "$d" -type f -delete 2>/dev/null || true
                fi
              done
            fi
          fi
          sleep 10
          attempt=$((attempt + 1))
        done

    # -------------------------------------------------------------------------
    # Outputs
    # -------------------------------------------------------------------------
    - name: Collect outputs
      if: inputs.install-only != 'true' && inputs.args != '' && inputs.determinism != 'true'
      id: outputs
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        set -euo pipefail
        dist="dist"
        for cfg in .anodizer.yaml .anodizer.yml anodizer.yaml anodizer.yml; do
          if [ -f "$cfg" ]; then
            d=$(grep -E '^dist:' "$cfg" | head -1 | sed 's/^dist:\s*//' | tr -d '"' | tr -d "'")
            [ -n "$d" ] && dist="$d"
            break
          fi
        done

        # Use a brace-grouped block so the closing delimiter always lands on
        # its own line, even if the JSON file has no trailing newline.
        if [ -f "${dist}/artifacts.json" ]; then
          {
            echo "artifacts<<ANODIZER_EOF"
            cat "${dist}/artifacts.json"
            echo ""
            echo "ANODIZER_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

        if [ -f "${dist}/metadata.json" ]; then
          {
            echo "metadata<<ANODIZER_EOF"
            cat "${dist}/metadata.json"
            echo ""
            echo "ANODIZER_EOF"
          } >> "$GITHUB_OUTPUT"

          # Extract release URL if present
          url=$(jq -r '.release_url // empty' "${dist}/metadata.json" 2>/dev/null || echo "")
          echo "release-url=${url}" >> "$GITHUB_OUTPUT"
        fi

    # -------------------------------------------------------------------------
    # Upload split artifacts (for split build jobs)
    # -------------------------------------------------------------------------
    - name: Upload split artifacts
      if: inputs.upload-dist == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ runner.os }}
        path: ${{ inputs.workdir }}/dist/
