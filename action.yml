name: "Anodizer Action"
description: "GitHub Action for Anodizer — a Rust-native release automation tool"
author: "tj-smith47"
branding:
  color: "orange"
  icon: "package"

inputs:
  # ---------------------------------------------------------------------------
  # Installation source (pick one path)
  # ---------------------------------------------------------------------------
  version:
    description: >
      Anodizer version to install from GitHub releases. Accepts an exact tag
      (e.g. "v0.1.1"), the literal "latest" (newest stable release), or the
      literal "nightly" (newest release whose tag matches `*-nightly`,
      i.e. `vX.Y.Z-<sha>-nightly`). Semver ranges such as "~> v2" are NOT
      supported — pass an explicit tag, "latest", "nightly", or use
      `from-artifact` / `from-source`. Ignored when `from-artifact` or
      `from-source` is set.
    default: "latest"
    required: false
  from-artifact:
    description: >
      Download a pre-built anodizer binary from a workflow artifact instead of
      GitHub releases. Set to the artifact name (e.g. "anodizer-linux"). For
      cross-workflow downloads, also set `artifact-run-id`.
    required: false
  artifact-run-id:
    description: >
      Workflow run ID to download the artifact from. Use "auto" to automatically
      resolve the latest successful run of `artifact-workflow` for the current
      commit. Use a numeric ID for explicit control. Omit to download from
      the current workflow run.
    required: false
  artifact-workflow:
    description: >
      Workflow filename to search when `artifact-run-id` is "auto"
      (e.g. "ci.yml"). Ignored otherwise.
    default: "ci.yml"
    required: false
  from-source:
    description: >
      Build anodizer from source in the current workdir (bootstrap mode).
      Requires a Rust toolchain — combine with `install-rust: true` if needed.
      Useful when `from-artifact` is only available for one platform and the
      current runner needs a platform-native binary.
    default: "false"
    required: false
  from-branch:
    description: >
      Shallow-clone `tj-smith47/anodizer` at the given branch name and build
      it from source. Accepts a branch name only (e.g. "my-feature", "main").
      The repository is hardcoded to `tj-smith47/anodizer`; do not include an
      owner prefix, repo name, or commit SHA — branch names only. Rust is
      auto-installed. Mutually exclusive
      with `version`, `from-artifact`, and `from-source`.
    default: ""
    required: false

  # ---------------------------------------------------------------------------
  # Dependency setup
  # ---------------------------------------------------------------------------
  install:
    description: >
      Comma-separated list of build/pipeline dependencies to install.
      Supported: nfpm, makeself, snapcraft, rpmbuild, cosign, syft, zig,
      cargo-zigbuild, upx, nsis, create-dmg, flatpak, alejandra. Uses the
      platform's native package manager (apt on Linux, brew on macOS,
      choco on Windows); some deps fall back to direct downloads when no
      packaged version exists.
    required: false
  auto-install:
    description: >
      Parse `.anodizer.yaml` in the workdir and automatically install the
      dependencies needed by the configured stages (nfpm, makeself, snapcraft,
      rpmbuild for srpm, cosign for binary_signs/docker_signs, syft for sboms,
      nsis, create-dmg, flatpak-builder, upx, zig+cargo-zigbuild for
      cross-compilation, alejandra when the nix publisher requests it as the
      formatter).
    default: "false"
    required: false
  install-rust:
    description: "Install the stable Rust toolchain (dtolnay/rust-toolchain)."
    default: "false"
    required: false

  # ---------------------------------------------------------------------------
  # Workspace resolution (monorepo tag → crate mapping)
  # ---------------------------------------------------------------------------
  resolve-workspace:
    description: >
      Resolve the triggering tag to a crate name using `anodizer resolve-tag`.
      Set to "true" on tag-triggered release workflows. Populates the
      `workspace`, `crate-path`, and `has-builds` outputs.
    default: "false"
    required: false

  # ---------------------------------------------------------------------------
  # Docker setup (for projects using docker_v2 in .anodizer.yaml)
  # ---------------------------------------------------------------------------
  docker-registry:
    description: >
      Container registry to log in to (e.g. "ghcr.io"). When set, the action
      logs in, and sets up QEMU + buildx for multi-platform builds.
    required: false
  docker-username:
    description: "Registry username (defaults to github.actor via GITHUB_ACTOR env)."
    required: false
  docker-password:
    description: "Registry password or token (e.g. secrets.GITHUB_TOKEN)."
    required: false

  # ---------------------------------------------------------------------------
  # Split artifact management
  # ---------------------------------------------------------------------------
  upload-dist:
    description: >
      Upload dist/ as a workflow artifact after running anodizer. Set to "true"
      in split build jobs. The artifact name defaults to "dist-$RUNNER_OS".
    default: "false"
    required: false
  download-dist:
    description: >
      Download and merge dist-* artifacts before running anodizer. Set to "true"
      in merge jobs. Merges all artifacts matching "dist-*" into dist/.
    default: "false"
    required: false

  # ---------------------------------------------------------------------------
  # Key material
  # ---------------------------------------------------------------------------
  gpg-private-key:
    description: >
      GPG private key contents to import for signing. The key is piped into
      `gpg --batch --import`.
    required: false
  apk-private-key:
    description: >-
      PEM-format RSA private key for signing apk packages produced by
      nfpm. Required if your `.anodizer.yaml` configures
      `nfpm[].apk.signature` (apk-tools uses its own RSA-PSS scheme,
      not OpenPGP, so the GPG key consumed by `gpg-private-key` does
      not work here). The private key is written to a temp file with
      mode 0600 and the path is exported as `APK_PRIVATE_KEY_PATH` for
      subsequent steps and the anodizer config to consume. The matching
      public key is derived via `openssl rsa -pubout`, exported as
      `APK_PUBLIC_KEY_PATH`, and copied into `./dist/` as
      `<repo>-apk-signing-key.rsa.pub` so consumers can attach it as
      a release asset via `release.extra_files`; apk verifiers install
      that file under `/etc/apk/keys/` before `apk add`-ing a signed
      package.
    required: false
    default: ""
  cosign-key:
    description: >
      Cosign private key contents. Written to `cosign.key` in the workdir
      with mode 0600. Pair with `COSIGN_PASSWORD` in the env.
    required: false

  # ---------------------------------------------------------------------------
  # Execution
  # ---------------------------------------------------------------------------
  args:
    description: >
      Arguments to pass to anodizer (e.g. "release --snapshot"). Do NOT embed
      secrets or tokens here — this value appears in workflow logs. Pass
      secrets via the `env:` block (e.g. `GITHUB_TOKEN`, `COSIGN_PASSWORD`).
    required: false
  workdir:
    description: "Working directory (below repository root)."
    default: "."
    required: false
  install-only:
    description: "Only install anodizer without running it."
    default: "false"
    required: false

  # ---------------------------------------------------------------------------
  # Determinism harness
  # ---------------------------------------------------------------------------
  determinism:
    description: >
      Run the determinism harness (`anodizer check determinism`) on this shard.
      When true, the action: installs Rust (if not already), builds anodizer
      from source, installs cross-build deps (zig, cargo-zigbuild, upx) on
      Linux, derives the configured-target CSV for the current RUNNER_OS via
      `anodizer targets --json`, `rustup target add`s those triples, and
      invokes the harness. Intended to be the entire body of a per-OS
      harness shard on a 3-OS matrix [ubuntu-latest, macos-latest,
      windows-latest]. Mutually exclusive with `args`.
    default: "false"
    required: false
  determinism-runs:
    description: "N for `anodizer check determinism --runs=N`."
    default: "2"
    required: false
  determinism-stages:
    description: >
      Stages to validate (comma-separated). When unset, defaults to the
      stages configured-and-installable on the current RUNNER_OS:
      Linux gets `build,source,upx,archive,nfpm,makeself,snapcraft,sbom,sign,checksum`;
      macOS and Windows get `build,source,upx,archive,sbom,sign,checksum`
      (no nfpm/makeself/snapcraft — apt is Linux-only and apk/deb/rpm
      signing isn't provisioned on the non-Linux shards). Explicit
      values override.
    default: ""
    required: false
  determinism-targets:
    description: >
      Explicit target CSV override. When unset, the action filters
      `anodizer targets --json` to entries matching the current RUNNER_OS.
      Set when your shard runs on a non-standard runner label.
    required: false
  determinism-crate:
    description: >
      Scope the harness to a single workspace crate via
      `anodizer check determinism --crate <name>`. Required when the
      release workflow fans out per crate (e.g. matrix over
      `fromJson(needs.tag.outputs.crates)`) so each shard's preserved
      dist lands under its own `<crate>/` subdir for collision-free
      merge in the downstream publish job.
    default: ""
    required: false
  preserve-dist:
    description: >
      Have the determinism harness preserve its hermetic dist tree to
      `./preserved-dist/` so a downstream `release: --publish-only` job
      can publish directly from the byte-stable artifacts. Manifests
      get a `-<shard-label>` suffix (`context-<label>.json`, etc.) so
      sharded matrix uploads don't collide under `merge-multiple: true`.
      Requires `determinism: 'true'` and `shard-label`.
    default: "false"
    required: false
  shard-label:
    description: >
      Per-shard suffix appended to preserved-dist manifests. The caller
      names each shard explicitly; the action does not derive labels.
      Required when `preserve-dist: 'true'`.
    required: false
    default: ""

outputs:
  artifacts:
    description: "Build result artifacts JSON (contents of dist/artifacts.json)."
    value: ${{ steps.outputs.outputs.artifacts }}
  metadata:
    description: "Build result metadata JSON (contents of dist/metadata.json)."
    value: ${{ steps.outputs.outputs.metadata }}
  release-url:
    description: "URL of the created GitHub release (extracted from metadata.json)."
    value: ${{ steps.outputs.outputs.release-url }}
  workspace:
    description: "Crate name resolved from the triggering tag (requires resolve-workspace: true)."
    value: ${{ steps.resolve-workspace.outputs.crate }}
  crate-path:
    description: "Path to the resolved crate directory (requires resolve-workspace: true)."
    value: ${{ steps.resolve-workspace.outputs.path }}
  has-builds:
    description: "Whether the resolved crate has binary builds configured (requires resolve-workspace: true)."
    value: ${{ steps.resolve-workspace.outputs.has-builds }}
  split-matrix:
    description: >
      JSON matrix for `strategy.matrix` covering all configured build targets.
      Produced from `.anodizer.yaml` when `install-only: true`. Each entry has
      `os`, `target`, and `artifact` fields.
    value: ${{ steps.split-matrix.outputs.matrix }}
  crates:
    description: >
      JSON array of crate names that `anodizer tag` produced tags for in this
      run. Empty array `[]` when nothing was tagged. Use as
      `fromJson(steps.<id>.outputs.crates)` to drive downstream matrix
      strategies.
    value: ${{ steps.outputs.outputs.crates }}
  versions:
    description: >
      JSON object mapping crate name to bumped version, from `anodizer tag`.
      Empty `{}` when nothing was tagged. Consume with
      `fromJson(steps.<id>.outputs.versions).<crate>` or bracket-form for
      hyphenated crate names: `fromJson(steps.<id>.outputs.versions)['my-crate']`.
    value: ${{ steps.outputs.outputs.versions }}
  new-tag:
    description: >
      Tag `anodizer tag` created this run (e.g. `v1.2.3`), for single-crate and
      lockstep-workspace repos. Empty when no tag was cut. Per-crate workspaces
      surface tags via `crates`/`versions` instead.
    value: ${{ steps.outputs.outputs.new-tag }}
  old-tag:
    description: "Previous tag `anodizer tag` bumped from. Empty when there was none (first release)."
    value: ${{ steps.outputs.outputs.old-tag }}
  part:
    description: "Semver part bumped by `anodizer tag`: `major` | `minor` | `patch` | `none` | `custom`."
    value: ${{ steps.outputs.outputs.part }}
  tagged:
    description: >
      `'true'` when this run cut a new tag (`new-tag` is non-empty and differs
      from `old-tag`), `'false'` on a no-op run. Gate downstream release jobs on
      this for single-crate / lockstep repos.
    value: ${{ steps.outputs.outputs.tagged }}
  head-sha:
    description: >
      Commit SHA at HEAD after `anodizer tag --push` (the tag target — the
      version-sync bump commit, or the original HEAD when no bump was needed).
      Check this out in downstream jobs so the tree matches the tag.
    value: ${{ steps.outputs.outputs.head-sha }}

runs:
  using: "composite"
  steps:
    # -------------------------------------------------------------------------
    # Platform detection
    # -------------------------------------------------------------------------
    - name: Determine platform
      id: platform
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/platform/detect.sh"

    # -------------------------------------------------------------------------
    # Input validation
    # -------------------------------------------------------------------------
    - name: Validate determinism inputs
      if: inputs.determinism == 'true' && inputs.args != ''
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/validate/determinism-inputs.sh"

    - name: Validate install-path inputs
      if: >-
        (inputs.from-branch != '' && inputs.from-source == 'true') ||
        (inputs.from-branch != '' && inputs.from-artifact != '') ||
        (inputs.from-branch != '' && inputs.version != 'latest' && inputs.version != '') ||
        (inputs.from-source == 'true' && inputs.from-artifact != '') ||
        (inputs.from-source == 'true' && inputs.version != 'latest' && inputs.version != '') ||
        (inputs.from-artifact != '' && inputs.version != 'latest' && inputs.version != '')
      shell: bash
      env:
        FROM_BRANCH: ${{ inputs.from-branch }}
        FROM_SOURCE: ${{ inputs.from-source }}
        FROM_ARTIFACT: ${{ inputs.from-artifact }}
        VERSION: ${{ inputs.version }}
      run: "${GITHUB_ACTION_PATH}/scripts/validate/install-path.sh"

    - name: Validate preserve-dist inputs
      if: inputs.preserve-dist == 'true'
      shell: bash
      env:
        DETERMINISM: ${{ inputs.determinism }}
        SHARD_LABEL: ${{ inputs.shard-label }}
      run: "${GITHUB_ACTION_PATH}/scripts/validate/preserve-dist.sh"

    # -------------------------------------------------------------------------
    # Rust toolchain — prereq for from-source, from-branch, cargo-zigbuild,
    # and the determinism harness (which builds anodizer from source so it
    # tests the actual code under review, not a stale release).
    # -------------------------------------------------------------------------
    - name: Install Rust toolchain
      if: inputs.install-rust == 'true' || inputs.determinism == 'true' || inputs.from-branch != ''
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

    # -------------------------------------------------------------------------
    # Cargo build cache (from-source / determinism / from-branch paths).
    # rust-cache covers Cargo.lock-stable runs; sccache covers Cargo.lock
    # churn and the determinism harness's per-run fresh worktrees (where
    # target/ is wiped between runs). Layered, not replacing.
    # -------------------------------------------------------------------------
    - name: Compute cache key suffix
      if: inputs.determinism == 'true' || inputs.from-source == 'true' || inputs.from-branch != ''
      id: cache-key
      shell: bash
      env:
        DETERMINISM: ${{ inputs.determinism }}
        FROM_BRANCH: ${{ inputs.from-branch }}
        WORKSPACE_DIR: ${{ inputs.from-branch != '' && format('{0}/anodizer-src', runner.temp) || inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/rust/cache-key.sh"

    - name: Cache cargo target dir
      if: inputs.determinism == 'true' || inputs.from-source == 'true' || inputs.from-branch != ''
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: anodizer-action-${{ steps.cache-key.outputs.suffix }}
        workspaces: ${{ inputs.from-branch != '' && format('{0}/anodizer-src', runner.temp) || inputs.workdir }}

    - name: Set up sccache
      if: inputs.determinism == 'true' || inputs.from-source == 'true'
      uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.9

    # sccache is armed only for determinism / from-source. from-branch clones
    # a remote and builds it once per CI run with no chance of reuse, so the
    # wrapper is pure overhead AND exposes the build to Azure Storage outages
    # ("Our services aren't available right now") — every rustc call would
    # exit 101.
    - name: Enable sccache wrapper (with health probe)
      if: inputs.determinism == 'true' || inputs.from-source == 'true'
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/rust/sccache-probe.sh"

    # -------------------------------------------------------------------------
    # Dependency installation
    # -------------------------------------------------------------------------
    - name: Auto-detect dependencies from .anodizer.yaml
      if: inputs.auto-install == 'true'
      id: auto-detect
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/auto-detect-deps.sh"

    - name: Emit determinism dependency set
      if: inputs.determinism == 'true'
      id: det-deps
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/install/determinism-deps.sh"

    - name: Install dependencies
      if: inputs.install != '' || steps.auto-detect.outputs.deps != '' || steps.det-deps.outputs.deps != ''
      shell: bash
      env:
        EXPLICIT_INSTALL: ${{ inputs.install }}
        AUTO_INSTALL: ${{ steps.auto-detect.outputs.deps }}
        DETERMINISM_INSTALL: ${{ steps.det-deps.outputs.deps }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/deps.sh"

    # -------------------------------------------------------------------------
    # Key material
    # -------------------------------------------------------------------------
    - name: Import GPG private key
      if: inputs.gpg-private-key != ''
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: "${GITHUB_ACTION_PATH}/scripts/keys/gpg.sh"

    - name: Provision apk signing keys
      if: inputs.apk-private-key != ''
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        APK_PRIVATE_KEY_INPUT: ${{ inputs.apk-private-key }}
      run: "${GITHUB_ACTION_PATH}/scripts/keys/apk.sh"

    - name: Write cosign key
      if: inputs.cosign-key != ''
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        COSIGN_KEY_CONTENTS: ${{ inputs.cosign-key }}
      run: "${GITHUB_ACTION_PATH}/scripts/keys/cosign.sh"

    # -------------------------------------------------------------------------
    # Installation — Path A: from workflow artifact
    # -------------------------------------------------------------------------
    - name: Resolve artifact run ID
      if: inputs.from-artifact != '' && inputs.artifact-run-id != ''
      id: resolve-run
      shell: bash
      env:
        ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        ARTIFACT_WORKFLOW: ${{ inputs.artifact-workflow }}
        FROM_ARTIFACT: ${{ inputs.from-artifact }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/resolve-artifact-id.sh"

    - name: Download artifact
      if: inputs.from-artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.from-artifact }}
        path: ${{ runner.tool_cache }}/anodizer/artifact
        github-token: ${{ inputs.artifact-run-id != '' && github.token || '' }}
        run-id: ${{ steps.resolve-run.outputs.run_id || '' }}

    - name: Install from artifact
      if: inputs.from-artifact != ''
      shell: bash
      env:
        BIN: ${{ steps.platform.outputs.bin }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/artifact.sh"

    # -------------------------------------------------------------------------
    # Installation — Path B: from GitHub release
    # -------------------------------------------------------------------------
    - name: Resolve version
      if: inputs.from-artifact == '' && inputs.from-source != 'true' && inputs.determinism != 'true' && inputs.from-branch == ''
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/resolve-version.sh"

    - name: Download release
      if: inputs.from-artifact == '' && inputs.from-source != 'true' && inputs.determinism != 'true' && inputs.from-branch == ''
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
        OS: ${{ steps.platform.outputs.os }}
        ARCH: ${{ steps.platform.outputs.arch }}
        EXT: ${{ steps.platform.outputs.ext }}
        BIN: ${{ steps.platform.outputs.bin }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/release.sh"

    # -------------------------------------------------------------------------
    # Installation — Path C: from source (bootstrap)
    # Installation — Path D: clone branch of tj-smith47/anodizer, then build
    #
    # After the clone, the from-source build step takes over and finds the
    # cloned tree via $ANODIZER_SRC_DIR (env-written by the clone step)
    # rather than inputs.workdir, so the user's checkout is never touched.
    # -------------------------------------------------------------------------
    - name: Clone anodizer branch
      if: inputs.from-branch != ''
      id: clone-branch
      shell: bash
      env:
        FROM_BRANCH: ${{ inputs.from-branch }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/from-branch.sh"

    - name: Build anodizer from source
      if: inputs.from-source == 'true' || inputs.determinism == 'true' || inputs.from-branch != ''
      shell: bash
      working-directory: ${{ env.ANODIZER_SRC_DIR || inputs.workdir }}
      env:
        BIN: ${{ steps.platform.outputs.bin }}
        FROM_BRANCH: ${{ inputs.from-branch }}
      run: "${GITHUB_ACTION_PATH}/scripts/install/from-source.sh"

    # -------------------------------------------------------------------------
    # Workspace resolution (monorepo tag → crate)
    # -------------------------------------------------------------------------
    - name: Resolve workspace from tag
      if: inputs.resolve-workspace == 'true' && github.ref_type == 'tag'
      id: resolve-workspace
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        TAG: ${{ github.ref_name }}
      run: "${GITHUB_ACTION_PATH}/scripts/workspace/resolve-tag.sh"

    # -------------------------------------------------------------------------
    # Docker setup (login + QEMU + buildx)
    # -------------------------------------------------------------------------
    - name: Log in to container registry
      if: inputs.docker-registry != ''
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.docker-registry }}
        username: ${{ inputs.docker-username || github.actor }}
        password: ${{ inputs.docker-password }}

    - name: Set up QEMU
      if: inputs.docker-registry != ''
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

    - name: Set up Docker Buildx
      if: inputs.docker-registry != ''
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    # -------------------------------------------------------------------------
    # Split artifact handling
    # -------------------------------------------------------------------------
    - name: Download split artifacts
      if: inputs.download-dist == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ inputs.workdir }}/dist/
        pattern: dist-*
        merge-multiple: true

    - name: Verify split artifacts
      if: inputs.download-dist == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/workspace/verify-split.sh"

    - name: Produce split matrix
      if: inputs.install-only == 'true'
      id: split-matrix
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: "${GITHUB_ACTION_PATH}/scripts/workspace/split-matrix.sh"

    # -------------------------------------------------------------------------
    # Determinism harness — runs after the from-source build (so `anodizer`
    # is on PATH) and after install-deps (so zig / cargo-zigbuild / upx are
    # available for the per-target rebuilds the harness drives).
    # -------------------------------------------------------------------------
    - name: Resolve determinism target CSV
      if: inputs.determinism == 'true'
      id: det-targets
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        RUNNER_OS: ${{ runner.os }}
        OVERRIDE: ${{ inputs.determinism-targets }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/resolve-targets.sh"

    - name: Install determinism target triples
      if: inputs.determinism == 'true'
      shell: bash
      env:
        TARGETS: ${{ steps.det-targets.outputs.csv }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/install-targets.sh"

    - name: Run determinism harness
      if: inputs.determinism == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        TARGETS: ${{ steps.det-targets.outputs.csv }}
        STAGES_INPUT: ${{ inputs.determinism-stages }}
        RUNS: ${{ inputs.determinism-runs }}
        PRESERVE_DIST: ${{ inputs.preserve-dist }}
        CRATE: ${{ inputs.determinism-crate }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/run-harness.sh"

    - name: Rename preserved-dist manifests per shard
      if: inputs.determinism == 'true' && inputs.preserve-dist == 'true' && success()
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        SHARD_LABEL: ${{ inputs.shard-label }}
      run: "${GITHUB_ACTION_PATH}/scripts/determinism/rename-preserved-dist.sh"

    # -------------------------------------------------------------------------
    # Run anodizer
    # -------------------------------------------------------------------------
    - name: Run anodizer
      if: inputs.install-only != 'true' && inputs.args != '' && inputs.determinism != 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ANODIZER_ARGS: ${{ inputs.args }}
        ANODIZER_STDOUT_LOG: ${{ runner.temp }}/anodizer-stdout.log
      run: "${GITHUB_ACTION_PATH}/scripts/run/anodizer.sh"

    # -------------------------------------------------------------------------
    # Outputs
    # -------------------------------------------------------------------------
    - name: Collect outputs
      if: inputs.install-only != 'true' && inputs.args != '' && inputs.determinism != 'true'
      id: outputs
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ANODIZER_STDOUT_LOG: ${{ runner.temp }}/anodizer-stdout.log
      run: "${GITHUB_ACTION_PATH}/scripts/run/outputs.sh"

    # -------------------------------------------------------------------------
    # Upload split artifacts (for split build jobs)
    # -------------------------------------------------------------------------
    - name: Upload split artifacts
      if: inputs.upload-dist == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ runner.os }}
        path: ${{ inputs.workdir }}/dist/
